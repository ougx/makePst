<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="720" viewBox="0 0 1060 720" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrow-back" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M10,0 L0,5 L10,10 z" fill="#222"/>
    </marker>
  </defs>
  <style>
    .box { fill: #fff; stroke: #222; stroke-width: 1.6; }
    .hub { fill: #e6e6e6; stroke: #222; stroke-width: 2; }
    .file { fill: #f7f7f7; stroke: #555; stroke-width: 1.2; stroke-dasharray: 5 3; }
    .banner { fill: #f2f2f2; stroke: #222; stroke-width: 1.2; }
    .manifest { fill: #fafafa; stroke: #555; stroke-width: 1.2; }
    .h { fill: #111; font-weight: bold; font-size: 17px; }
    .c { fill: #111; font-family: Menlo, Consolas, monospace; font-size: 14px; font-weight: bold; }
    .m { fill: #222; font-family: Menlo, Consolas, monospace; font-size: 12.5px; }
    .s { fill: #333; font-size: 13.5px; }
    .a { stroke: #222; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
    .a2 { stroke: #222; stroke-width: 1.7; fill: none; marker-end: url(#arrow); marker-start: url(#arrow-back); }
  </style>

  <!-- white background: never rely on the viewer's transparency handling -->
  <rect x="0" y="0" width="1060" height="720" fill="#fff"/>

  <!-- diff: comparison of any two configurations -->
  <path d="M150,170 C230,105 770,105 850,170" class="a2"/>
  <text x="500" y="84" text-anchor="middle" class="c">diff</text>
  <text x="500" y="102" text-anchor="middle" class="s">semantic comparison of configurations</text>

  <!-- main flow -->
  <rect x="40" y="170" width="220" height="110" rx="8" class="box"/>
  <text x="150.0" y="203" text-anchor="middle" class="h">Calibration workbook</text>
  <text x="150.0" y="228" text-anchor="middle" class="s">Excel or CSV tables</text>
  <text x="150.0" y="247" text-anchor="middle" class="s">formulas and helper columns kept</text>
  <text x="150.0" y="266" text-anchor="middle" class="s">reviewed project record</text>
  <rect x="400" y="180" width="200" height="90" rx="45" class="hub"/>
  <text x="500" y="216" text-anchor="middle" class="h">makePst</text>
  <text x="500" y="238" text-anchor="middle" class="s">structured data +</text>
  <text x="500" y="255" text-anchor="middle" class="s">consistency checks</text>
  <rect x="740" y="170" width="220" height="110" rx="8" class="box"/>
  <text x="850.0" y="203" text-anchor="middle" class="h">PEST control file</text>
  <text x="850.0" y="228" text-anchor="middle" class="s">PEST · PEST_HP · PEST++</text>
  <text x="850.0" y="247" text-anchor="middle" class="s">classic or version-2 format</text>
  <text x="850.0" y="266" text-anchor="middle" class="s">counts computed, priors generated</text>
  <path d="M260,208 L400,208" class="a"/>
  <text x="330" y="199" text-anchor="middle" class="c">build</text>
  <path d="M400,244 L260,244" class="a"/>
  <text x="330" y="265" text-anchor="middle" class="c">dump</text>
  <path d="M600,208 L740,208" class="a"/>
  <text x="670" y="199" text-anchor="middle" class="c">write</text>
  <path d="M740,244 L600,244" class="a"/>
  <text x="670" y="265" text-anchor="middle" class="c">read</text>

  <!-- model interface + validate -->
  <rect x="380" y="370" width="240" height="72" rx="8" class="file"/>
  <text x="500.0" y="403" text-anchor="middle" class="h">Model interface</text>
  <text x="500.0" y="428" text-anchor="middle" class="s">templates · instructions · model output</text>
  <path d="M500,270 L500,370" class="a"/>
  <text x="512" y="316" text-anchor="start" class="c">validate</text>
  <text x="512" y="334" text-anchor="start" class="s">consistency and interface checks</text>

  <!-- PEST run + results -->
  <rect x="730" y="370" width="240" height="72" rx="8" class="file"/>
  <text x="850.0" y="403" text-anchor="middle" class="h">PEST / PEST++ run</text>
  <text x="850.0" y="428" text-anchor="middle" class="s">parameter · residual · ensemble results</text>
  <path d="M810,280 L810,370" class="a"/>
  <text x="798" y="330" text-anchor="end" class="s">run</text>
  <path d="M890,370 L890,280" class="a" stroke-dasharray="6 4"/>
  <text x="902" y="318" text-anchor="start" class="c">parrep</text>
  <text x="902" y="336" text-anchor="start" class="s">selected values →</text>
  <text x="902" y="352" text-anchor="start" class="s">new control file</text>

  <!-- update: results back to the workbook -->
  <path d="M730,415 C560,500 300,500 150,280" class="a"/>
  <text x="430" y="492" text-anchor="middle" class="c">update</text>
  <text x="430" y="510" text-anchor="middle" class="s">results returned by name; formulas preserved</text>

  <!-- example provenance manifest -->
  <rect x="40" y="535" width="980" height="160" rx="6" class="manifest"/>
  <text x="60" y="563" text-anchor="start" class="h">Example provenance manifest (excerpt)</text>
  <text x="60" y="586" text-anchor="start" class="s">Written beside each produced file; full JSON also records timestamps, platform, and input roles.</text>
  <text x="60" y="616" text-anchor="start" class="m">makepst: 0.4.0</text>
  <text x="60" y="638" text-anchor="start" class="m">command: build</text>
  <text x="60" y="660" text-anchor="start" class="m">argv: makepst build tr13.pst regul ...</text>
  <text x="505" y="616" text-anchor="start" class="m">source: tr13.xlsx   sha256: b43fc509eafe...</text>
  <text x="505" y="638" text-anchor="start" class="m">sheets: 20</text>
  <text x="505" y="660" text-anchor="start" class="m">output: tr13.pst    sha256: 7b9f82a69ab9...</text>
  <text x="505" y="682" text-anchor="start" class="m">dimensions: 1,068 parameters · 41,747 observations</text>
</svg>
