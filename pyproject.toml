[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "makepst"
version = "0.4.0"
description = "Build PEST / PEST++ / PEST_HP control files from spreadsheet tables, read them back, and push results into the workbook"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Michael Ou", email = "ougengxin@gmail.com"}]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas>=2.0",
    "openpyxl>=3.1",
]
keywords = ["PEST", "PEST++", "PEST_HP", "groundwater", "calibration", "MODFLOW", "Excel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Hydrology",
]

[project.urls]
Homepage = "https://github.com/ougx/makePst"
Repository = "https://github.com/ougx/makePst"
Issues = "https://github.com/ougx/makePst/issues"

[project.optional-dependencies]
excel = ["xlwings"]
pyemu = ["pyemu"]
test = ["pytest"]

[project.scripts]
makepst = "makepst.cli:main"

[tool.setuptools]
packages = ["makepst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
